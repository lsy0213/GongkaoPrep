[project]
name = "gongkao-prep"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "-q -m 'not golden and not lan'"
markers = ["lan: 手机访问（会监听局域网地址，Windows 可能弹防火墙提示）：pytest -m lan", "golden: 资料整理黄金样本（需要本机资料，较慢）：pytest -m golden"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["build", "dist", "_inspection"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "BLE"]
ignore = [
  "E501",   # 长行：中文注释和正则较多，交给 line-length 参考即可
  "E731",   # lambda 赋值（路由里的小工具函数）
  "B008", "S101", "S311",  # 测试里的 assert、出题用的 random 不是安全场景
  "S603", "S607",  # 调用本机 explorer / powershell 是有意为之
  "S608",  # 表名来自固定白名单的 SQL 拼接
  "UP015", "UP031", "UP032",
  "E741",  # 版面解析里 l（line）这类短变量名很多，不改
  "B023",  # 循环里定义的小函数都在同一轮里调用，不存在“晚绑定”问题（逐个核对过）
  "B905",  # zip 不加 strict：长度不等时截断正是想要的
  "S324",  # md5 只用来生成文件 id / 缓存键，不是安全用途
  "S110", "S112",  # 个别文件、个别页出错就跳过，是整理资料时有意的容错
]
