name: 检查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 代码规范（ruff）
        run: python -m ruff check .

      - name: 前端检查（JS 语法、拼 HTML 时漏转义）
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_frontend.py

      - name: 教程格式检查
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_course.py

      - name: 测试
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest

  build:
    # 打 v 开头的标签时打包，上传目录版压缩包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm --clean GongkaoPrep.spec
      - run: Compress-Archive -Path dist/GongkaoPrep/* -DestinationPath GongkaoPrep-${{ github.ref_name }}.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: GongkaoPrep-${{ github.ref_name }}
          path: GongkaoPrep-${{ github.ref_name }}.zip
