# 上岸备考前面的 Nginx：HTTPS（HTTP/2）、压缩，所有请求都转给只听本机的 Python（每个请求都要先登录，所以静态文件也不由 Nginx 直接发）。
# setup.sh 会把它装到 /etc/nginx/sites-available/gongkao，并把 __PORT__ 换成对外的端口（默认 443，地址栏不用写端口）。
# 证书和同一台服务器上的 EngNest 共用 /etc/nginx/ssl/engnest.{crt,key}（Let's Encrypt 给 IP 签的证书，哪个端口都能用，
# engnest-cert.timer 自动续期并重载 Nginx）。

server {
    listen __PORT__ ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/engnest.crt;
    ssl_certificate_key /etc/nginx/ssl/engnest.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 压缩：脚本、样式、题目和资料的 JSON 大多是文字
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 50m;   # 面试录音、职位表上传

    location / {
        proxy_pass http://127.0.0.1:8769;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;          # 原样转给 Python 核对（GONGKAO_PUBLIC_HOSTS）
        proxy_set_header X-Real-IP $remote_addr;   # 登录输错次数按真实 IP 算
        proxy_read_timeout 300s;
        proxy_buffering off;                       # AI 讲解是边生成边输出的
    }
}
